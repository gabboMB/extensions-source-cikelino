
name: Build MangaWorld

on:
  push:
    branches:
      - main
    paths:
      - 'src/it/mangaworld/**'
      - '.github/workflows/build-mangaworld.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: Build MangaWorld Extension
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java 25
        uses: actions/setup-java@v4
        with:
          java-version: '25'
          distribution: temurin

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Build MangaWorld
        run: ./gradlew :src:it:mangaworld:assembleRelease

      - name: Upload APK and JAR
        uses: actions/upload-artifact@v4
        with:
          name: mangaworld-extension
          path: |
            src/it/mangaworld/build/outputs/apk/release/*.apk
            src/it/mangaworld/build/outputs/jar/release/*.jar
            src/it/mangaworld/build/keiyoushi-source-info.json
          if-no-files-found: error
          retention-days: 30
